name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Gradle (includes shadowJar)
      uses: gradle/gradle-build-action@v3
      with:
        arguments: build shadowJar

    - name: List all generated JARs (debug step)
      run: find . -name "*.jar"

    - name: Upload Shadow JARs
      uses: actions/upload-artifact@v4
      with:
        name: shadow-jars
        path: |
          all-generated/*.jar
          test-suite/mc-config/plugins/*.jar
